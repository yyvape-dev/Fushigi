  <header><p class="eyebrow">助っ人 03 · 待機・歩行・詠唱</p><h1>シェリニーニャ</h1><p>薄朱色の目元、淡いクマ。眠たげな黒魔法使い。</p></header>
  <section aria-labelledby="comparison-title">
    <h2 id="comparison-title">ラナと同じ床に</h2>
