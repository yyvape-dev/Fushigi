<main><p>FUSHIGI / WEAPONS 01</p><h1>武器12種類の装備確認</h1><p>武器を切り替え、待機・攻撃・振り抜き・戻りを確認できます。盾と主人公は承認済みv3を使用しています。</p>
<div class="bar"><select id="weaponSelect" aria-label="武器"></select><select id="direction" aria-label="方向"></select><select id="speed" aria-label="再生速度"><option value="1">通常 300ms</option><option value="0.5">0.5倍速</option><option value="0.25">0.25倍速</option></select><button id="pause">一時停止</button><button id="replay">攻撃を再生</button><label><input type="checkbox" id="weapon" checked>武器</label><label><input type="checkbox" id="shield" checked>盾</label><label><input type="checkbox" id="debug">握り位置</label></div>
<p id="error" role="alert"></p><div class="pair"><section><h2>待機・基準絵</h2><canvas id="reference" width="512" height="512"></canvas></section><section><h2>攻撃・コマ送り</h2><canvas id="attack" width="512" height="512"></canvas></section></div><input id="scrub" type="range" min="0" max="5" value="0" aria-label="攻撃コマ"><p id="status" aria-live="polite"></p>
<h2>ゲーム内サイズ・8方向</h2><canvas id="all" width="1024" height="560"></canvas><div class="note"><p>確認待ちの初版です。剣の描画倍率0.66、盾0.59。NWは盾が腕全体の後ろ、SEは手より前。武器は正面原画1視点を使用しており、方向別の原画追加は今後の範囲です。</p><p><a href="weapons-catalog.png">武器12種類の一覧画像</a> · <a href="NW-all-frames.png">NW 全武器・全コマ</a> · <a href="SE-all-frames.png">SE 全武器・全コマ</a> · <a href="game-size.png">全武器・8方向の実表示サイズ</a> · <a href="../fushigi-equipment-v3/preview.html">承認済みv3</a></p></div><h2>原画と装備キー</h2><img src="weapons-catalog.png" alt="武器12種類の一覧。木刀から火迅風魔刀まで。" width="768" height="864"></main>
