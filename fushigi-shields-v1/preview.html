<style>*{box-sizing:border-box}body{margin:0;background:#192328;color:#f1ecdf;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 18px}h1{font-size:27px}h2{font-size:18px}p{line-height:1.8;color:#bbc9ca}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}select,button{font:inherit;background:#293b42;color:white;border:1px solid #718a8e;border-radius:8px;padding:10px;max-width:100%}label{display:flex;gap:6px;align-items:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas,img{display:block;max-width:100%;height:auto;border-radius:10px}canvas{background:#e8e3d9;width:100%}input[type=range]{width:100%;margin-top:20px}a{color:#eac477}.note{background:#26373d;padding:12px 18px;border-radius:10px}#error{color:#ffac91}@media(max-width:650px){.pair{grid-template-columns:1fr}}</style>
<main><p>FUSHIGI / SHIELDS 01</p><h1>盾10種類 × 4視点</h1><p>盾と武器を選び、方向・コマ送りで腕と装備の重なりを確認できます。正面・斜め・側面・裏面の原画を方向に合わせて切り替えます。</p>
<div class="bar"><select id="shieldSelect" aria-label="盾"></select><select id="weaponSelect" aria-label="武器"></select><select id="direction" aria-label="方向"></select><select id="speed" aria-label="再生速度"><option value="1">通常 300ms</option><option value="0.5">0.5倍速</option><option value="0.25">0.25倍速</option></select><button id="pause">一時停止</button><button id="replay">攻撃を再生</button><label><input type="checkbox" id="weapon" checked>武器</label><label><input type="checkbox" id="shield" checked>盾</label><label><input type="checkbox" id="debug">握り位置</label></div>
<p id="error" role="alert"></p><div class="pair"><section><h2>待機・基準絵</h2><canvas id="reference" width="512" height="512"></canvas></section><section><h2>攻撃・コマ送り</h2><canvas id="attack" width="512" height="512"></canvas></section></div><input id="scrub" type="range" min="0" max="5" value="0" aria-label="攻撃コマ"><p id="status" aria-live="polite"></p>
<h2>ゲーム内サイズ・8方向</h2><canvas id="all" width="1024" height="560"></canvas><h2>選択中の盾の4視点</h2><canvas id="views" width="800" height="228"></canvas><div class="note"><p>盾の初版・確認待ち。剣0.66、盾0.59。NWでは盾が腕全体の後ろ、SEでは手より前です。主人公と攻撃は承認済みv3を使用しています。</p><p><a href="shields-catalog.png">盾10種類の一覧</a> · <a href="shield-views-catalog.png">40枚の視点一覧</a> · <a href="NW-all-frames.png">NW 全盾・全コマ</a> · <a href="SE-all-frames.png">SE 全盾・全コマ</a> · <a href="game-size.png">全盾・8方向の実表示サイズ</a> · <a href="../fushigi-weapons-v1/preview.html">武器12種類</a> · <a href="../fushigi-equipment-v3/preview.html">承認済みv3</a></p></div><h2>盾10種類の正面</h2><img src="shields-catalog.png" width="800" height="456" alt="青銅甲の盾からミノタウロスの盾までの10種類"></main>
