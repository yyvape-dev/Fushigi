<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深層の敵：方向・動作</title>
<style>body{margin:0;background:#181c23;color:#eee7da;font:16px system-ui}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:23px}p{color:#b8b9b8;line-height:1.6}nav{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;padding:12px;background:#252933;z-index:1}select,button,a{font:inherit;color:#f3e1bc}select,button{background:#353c46;padding:10px;border:1px solid #75694e;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}article{background:#262d32;border:1px solid #4a4a42;border-radius:10px;text-align:center}canvas{width:230px;height:230px;max-width:100%;background:radial-gradient(ellipse at center,#525948,#202930)}h2{font-size:17px}#status{min-height:24px}</style>
<main><h1>深層の敵：方向・歩行・攻撃</h1><p>採用した7体を本編と同じ描画処理で表示。ランク2〜4は既存の色変換を使用。アビスロードは専用の王冠・翼の姿です。</p><nav><label>向き <select id="direction"></select></label><label>動作 <select id="action"><option value="idle">待機</option><option value="walk">歩行</option><option value="attack">攻撃</option></select></label><label>ランク <select id="tier"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button id="turn">向き自動切替</button><a href="game-review.html">本編で確認</a></nav><p id="status">画像読込中…</p><div class="grid" id="grid"></div></main>
<script src="../fushigi-monsters-v1/monsters-renderer.js"></script><script src="../assets/monster-roster.js"></script><script src="../assets/monster-families.js"></script><script>
// Only names/rank identity are needed by the shared painter in this standalone page.
const defs={};for(const k of Object.keys(MonsterRoster.names))defs[k]={from:1,w:1,hp:()=>1,atk:()=>[1,1],def:0,exp:1};defs.lord={};MonsterRoster.install(defs);
const D=['S','SW','W','NW','N','NE','E','SE'],K=['ninja','caster','mimic','summoner','charged','cannon','lord'],names=['ニンジャ','まじゅつ師','ミミック','すず坊主','いかずち岩','おおづつ兵','アビスロード'];
direction.innerHTML=D.map(d=>`<option>${d}</option>`).join('');direction.value='SE';let auto=false;turn.onclick=()=>{auto=!auto;turn.textContent=auto?'自動切替を停止':'向き自動切替';};
const canvases=K.map((k,i)=>{const a=document.createElement('article');a.innerHTML=`<h2>${names[i]}</h2><canvas width="256" height="256" aria-label="${names[i]}"></canvas>`;grid.append(a);return a.querySelector('canvas');});
MonsterSprites.load(()=>{document.getElementById('status').textContent=MonsterSprites.error|| (MonsterSprites.ready?'7体・8方向・歩行/攻撃 読込完了':'画像読込中…');});
function tick(t){const d=auto?D[Math.floor(t/1000)%8]:direction.value;canvases.forEach((c,i)=>{const g=c.getContext('2d');g.clearRect(0,0,256,256);const k=K[i],kind=k==='lord'||tier.value==='1'?k:k+'_'+tier.value;MonsterSprites.draw(g,kind,d,128,224,192,action.value,action.value==='attack'?t%900:t);});requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
