<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>壺19種類・操作確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171923;color:#efe4c9;font:14px system-ui}header{padding:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,button{font:inherit;padding:8px;border-radius:6px;background:#292e39;color:#fff;border:1px solid #a89463}p{margin:0;font-size:12px;color:#c9bfaa}iframe{display:block;width:100%;border:0;height:calc(100dvh - 95px)}a{color:#c4dbff}</style>
<header><strong>壺の操作確認</strong><select id="pot" aria-label="壺の種類"></select><select id="scenario" aria-label="確認する操作"><option value="bag">手持ちの壺</option><option value="floor">足元の壺</option><option value="contents">保存の壺の中から使う</option><option value="catalog">19種類の一覧</option></select><button id="reset">やり直す</button><p>本編のセーブとは別です。複数選択は□またはSpace。 <a href="../index.html" target="_top">本編へ</a></p></header><iframe id="game" title="壺の操作確認ゲーム"></iframe>
<script src="../assets/pots.js"></script><script>
const sel=document.getElementById('pot'),scenario=document.getElementById('scenario'),frame=document.getElementById('game');for(const [key,[name]]of Object.entries(PotSystem.definitions))sel.add(new Option(name,key));function load(){frame.src='game-review.html?pot='+encodeURIComponent(sel.value)+'&scenario='+scenario.value;const h=document.querySelector('header').getBoundingClientRect().height;frame.style.height='calc(100dvh - '+h+'px)';}sel.onchange=scenario.onchange=load;document.getElementById('reset').onclick=load;window.onresize=()=>{const h=document.querySelector('header').getBoundingClientRect().height;frame.style.height='calc(100dvh - '+h+'px)';};load();
</script></html>
