<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster House · 生成版確認</title>
<style>html,body{margin:0;background:#171b1f;color:#ddc9b4;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;bottom:18px;left:18px;right:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#35141c;color:#e5bdc0;border:1px solid #823640;border-radius:6px;padding:10px 16px}span{font-size:12px;opacity:.8}</style>
<canvas id="preview" aria-label="生成した深紅のドクロと文字、赤い霧が揺れるモンスターハウス演出"></canvas>
<nav><button id="replay">再生</button><button id="background">背景切替</button><span>生成版・確認用／本編には未反映</span></nav>
<script src="monster-house-vfx.js"></script>
<script>
const c=document.getElementById('preview'),g=c.getContext('2d');let start=performance.now(),mode=0;
const background=new Image();background.src='background.webp';
function paint(t){c.width=innerWidth;c.height=innerHeight;g.fillStyle=mode?'#19171a':'#40403b';g.fillRect(0,0,c.width,c.height);
 if(!mode&&background.complete&&background.naturalWidth){const s=Math.max(c.width/background.width,c.height/background.height);g.drawImage(background,(c.width-background.width*s)/2,(c.height-background.height*s)/2,background.width*s,background.height*s);}
 const elapsed=(t-start)%3200;MonsterHouseVfx.drawAt(g,elapsed,c.width,c.height,c.height*.43);requestAnimationFrame(paint);}
document.getElementById('replay').onclick=()=>start=performance.now();document.getElementById('background').onclick=()=>mode=1-mode;
MonsterHouseVfx.load(()=>{start=performance.now();requestAnimationFrame(paint);});
</script></html>
