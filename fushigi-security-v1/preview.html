<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>番兵・黒い番犬</title><style>body{margin:0;background:#211c26;color:#ecdcc4;font:15px/1.7 sans-serif}main{max-width:1120px;margin:auto;padding:18px}h1{font-size:23px}a{color:#a8dfeb}select,button{padding:8px;background:#3d3343;color:#fff0da;border:1px solid #b99762;border-radius:6px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.stage{background:#302a34;border:1px solid #7a6650;border-radius:12px;padding:10px;display:flex;justify-content:center;flex-wrap:wrap}.stage canvas{width:256px;height:auto;max-width:42vw}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}figure{margin:0;border:1px solid #635346;border-radius:9px;padding:5px;text-align:center}figure canvas{width:100%;max-width:240px}figcaption{font-size:12px;color:#cbb28f}@media(max-width:450px){#gallery{grid-template-columns:repeat(2,1fr)}}</style><main><h1>番兵と黒い番犬</h1><p>盗難時に現れる強い追手。番兵は高耐久・高攻撃、番犬は倍速で接近。階を移れば追跡は終了。</p><nav><a href="game-review.html">盗難を試す</a><a href="../fushigi-shops-v1/preview.html">店主3色</a><a href="../">本編</a><label>キャラ <select id="kind"><option value="guard">番兵</option><option value="dog">番犬</option></select></label><label>方向 <select id="direction"></select></label><label>動作 <select id="action"><option value="idle">待機</option><option value="walk">歩行</option><option value="attack">攻撃</option></select></label><button id="animate">動作を再生</button></nav><div class="stage" id="compare"></div><p>左からラナ・店主・番兵・黒い番犬。同じ足元線、同じ倍率で比較。</p><div id="gallery"></div><p>店主は入口ごとに1人。未精算品があると各出口を塞ぎ、精算・返品後は入口脇へ戻る。盗難時は全店主が敵対し、番兵と番犬が出現する。</p></main><script>
const D=['S','SW','W','NW','N','NE','E','SE'],images={},state={ready:false,direction:'S',action:'idle',kind:'guard',playing:false};window.ShopSecurityPreview=state;
direction.innerHTML=D.map(d=>'<option>'+d+'</option>').join('');function image(path){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=path;});}
function paint(canvas,im,label,isGuard=false){const c=canvas.getContext('2d');canvas.width=512;canvas.height=352;c.fillStyle='#302a34';c.fillRect(0,0,512,352);c.strokeStyle='#8f7863';c.beginPath();c.moveTo(0,280);c.lineTo(512,280);c.stroke();c.drawImage(im,isGuard?0:128,isGuard?0:56);c.fillStyle='#edceb0';c.font='17px sans-serif';c.textAlign='center';c.fillText(label,256,335);}
function draw(){const d=state.direction,a=state.action==='idle'?'idle':state.playing&&Math.floor(performance.now()/150)%2?'idle':state.action;compare.innerHTML='';for(const [key,label,guard]of [['lana/'+d,'ラナ',false],['keeper/'+d,'店主',false],['guard/'+d+'/'+a,'番兵',true],['dog/'+d+'/'+a,'黒い番犬',false]]){const c=document.createElement('canvas');compare.append(c);paint(c,images[key],label,guard);}for(const dir of D)paint(document.getElementById('view'+dir),images[state.kind+'/'+dir+'/'+a],dir,state.kind==='guard');}
gallery.innerHTML=D.map(d=>'<figure><canvas id="view'+d+'"></canvas><figcaption>'+d+'</figcaption></figure>').join('');
Promise.all(D.flatMap(d=>[image('../fushigi-equipment-v3/assets/hero-base/'+d+'.png').then(im=>images['lana/'+d]=im),image('../fushigi-shops-v1/assets/brown/'+d+'.png').then(im=>images['keeper/'+d]=im),...['guard','dog'].flatMap(k=>['idle','walk','attack'].map(a=>image('assets/'+k+'/'+d+'-'+a+'.png').then(im=>images[k+'/'+d+'/'+a]=im)))])).then(()=>{state.ready=true;draw();});direction.onchange=()=>{state.direction=direction.value;draw();};action.onchange=()=>{state.action=action.value;draw();};kind.onchange=()=>{state.kind=kind.value;draw();};animate.onclick=()=>{state.playing=!state.playing;if(state.playing&&state.action==='idle'){state.action='walk';action.value='walk';}animate.textContent=state.playing?'再生を止める':'動作を再生';draw();};setInterval(()=>{if(state.ready&&state.playing)draw();},100);
</script></html>
