<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パン4種 / Fushigi</title>
<style>body{margin:24px;background:#242b27;color:#f1dec0;font:16px system-ui}main{max-width:720px;margin:auto}header{display:flex;align-items:center;gap:20px}header img{width:128px}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}article{background:#394139;padding:16px;border-radius:16px;text-align:center}article img{width:112px;height:112px;object-fit:contain}.sizes img{width:32px;height:32px}.sizes{background:#222822;padding:10px}a{color:#edca85}</style>
<main><header><img src="../fushigi-equipment-v3/assets/hero-base/S.png"><div><h1>パン4種</h1><p>ラナと合わせた立体的なアイテム画像</p></div></header><section id="items"></section><p>下段は32pxのゲーム内サイズ比較。</p><a href="../index.html">ゲームへ</a></main>
<script>const names={bread_small:'小さなパン',bread:'パン',bread_big:'大きなパン',bread_moldy:'カビの生えたパン'};for(const [key,name] of Object.entries(names)){const a=document.createElement('article');a.innerHTML=`<img src="../assets/${key}.png" alt="${name}"><h2>${name}</h2><div class="sizes"><img src="../assets/${key}.png" alt="32px"></div>`;document.querySelector('#items').append(a);}</script>
