<h1>モンスター図鑑 <small>15系統 × 4段階</small></h1><p>基本種＋上位色違い3種、全60種。深層ほど上位種へ交代します。数値はその種の出現開始階での値です。</p>
<p><a href="../">本編で遊ぶ</a> · <a href="game-review.html">敵を選んでゲーム内で確認</a></p>

<p class="status" id="status" role="status">モンスター画像を読み込んでいます…</p><main id="catalog"></main><p class="foot">色違いでも輪郭・握り・動作は共通。獣・人型は簡略化した敵意のある顔、不定形・植物は素朴さや不気味さを残しています。</p>
