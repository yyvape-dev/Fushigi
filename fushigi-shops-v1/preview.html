<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店主・3色と8方向</title><style>body{margin:0;background:#211c23;color:#ecdcc4;font:15px/1.7 sans-serif}main{max-width:1120px;margin:auto;padding:18px}h1{font-size:23px}a{color:#a8dfeb}select,button{padding:8px;background:#44382b;color:#fff0da;border:1px solid #b99762;border-radius:6px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.stage{background:#302a34;border:1px solid #7a6650;border-radius:12px;padding:10px;display:flex;justify-content:center;flex-wrap:wrap}.stage canvas{width:128px;height:144px;max-width:31vw}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}figure{margin:0;border:1px solid #635346;border-radius:9px;padding:5px;text-align:center}figure canvas{width:100%;max-width:220px}figcaption{font-size:12px;color:#cbb28f}@media(max-width:450px){#gallery{grid-template-columns:repeat(2,1fr)}}</style><main><h1>店主 — 茶・藍・深紅</h1><p>服の色で、店主の強さと商品の希少度が上がる。ラナと同じ身長・足元。8方向を個別に描き、歩行と拳の攻撃を用意。</p><nav><a href="game-review.html">店で遊んで確認</a><a href="../">本編</a><label>方向 <select id="direction"></select></label><label>動作 <select id="action"><option value="idle">待機</option><option value="walk">歩行</option><option value="attack">攻撃</option></select></label><button id="animate">動作を再生</button></nav><div class="stage" id="compare"></div><p>左からラナ、茶の通常店、藍の上級店、深紅の希少店。線は足元。</p><div id="gallery"></div><p>商品を拾う→未精算→店主に支払い。不要なら未使用のまま店の床へ返す。使用した商品は請求が残る。売りたい自分の物は床に置いてから店主へ。盗みや店主への攻撃で追跡が始まる。番犬・警察は後日制作。</p></main><script>
const D=['S','SW','W','NW','N','NE','E','SE'],tiers=['brown','indigo','crimson'],images={},state={ready:false,direction:'S',action:'idle',playing:false};window.ShopPreviewState=state;
direction.innerHTML=D.map(d=>'<option>'+d+'</option>').join('');
function image(path){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=path;});}
function paint(canvas,im,label){const c=canvas.getContext('2d');canvas.width=256;canvas.height=288;c.fillStyle='#302a34';c.fillRect(0,0,256,288);c.strokeStyle='#8f7863';c.beginPath();c.moveTo(0,224);c.lineTo(256,224);c.stroke();c.drawImage(im,0,0);c.fillStyle='#edceb0';c.font='17px sans-serif';c.textAlign='center';c.fillText(label,128,271);}
function draw(){const d=state.direction,a=state.action==='idle'?'idle':state.playing&&Math.floor(performance.now()/150)%2?'idle':state.action;compare.innerHTML='';const lana=document.createElement('canvas');compare.append(lana);paint(lana,images['lana/'+d],'ラナ');for(const tier of tiers){const c=document.createElement('canvas');compare.append(c);paint(c,images[tier+'/'+d+'/'+a],{brown:'茶・通常',indigo:'藍・上級',crimson:'深紅・希少'}[tier]);}for(const dir of D)paint(document.getElementById('view'+dir),images['brown/'+dir+'/'+a],dir);}
gallery.innerHTML=D.map(d=>'<figure><canvas id="view'+d+'"></canvas><figcaption>'+d+'</figcaption></figure>').join('');
Promise.all(D.flatMap(d=>[image('../fushigi-equipment-v3/assets/hero-base/'+d+'.png').then(im=>images['lana/'+d]=im),...tiers.flatMap(tier=>['idle','walk','attack'].map(a=>image('assets/'+tier+'/'+d+(a==='idle'?'':'-'+a)+'.png').then(im=>images[tier+'/'+d+'/'+a]=im)))])).then(()=>{state.ready=true;draw();});
direction.onchange=()=>{state.direction=direction.value;draw();};action.onchange=()=>{state.action=action.value;draw();};animate.onclick=()=>{state.playing=!state.playing;if(state.playing&&state.action==='idle'){state.action='walk';action.value='walk';}animate.textContent=state.playing?'再生を止める':'動作を再生';draw();};setInterval(()=>{if(state.ready&&state.playing)draw();},100);
</script></html>
