# 自動マージ：同じリポジトリの feat/ fix/ docs/ experiment/ ci/ ブランチのPRで、
# 全テスト（tests/run_all.sh）が通ったらマージする。ドラフトPRは対象外（「Ready for review」にすると動く）。
# 止めたいとき：PRをドラフトにする／ブランチ名を上の接頭辞以外にする／このファイルを削除する。
name: auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'マージしたいPRの番号（手動実行用）'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       (startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/') ||
        startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'experiment/') ||
        startsWith(github.head_ref, 'ci/')))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 全テスト
        run: bash tests/run_all.sh
      - name: マージ
        env:
          # AUTOMERGE_TOKEN（個人用トークン）があればそれを使う。無ければ標準トークン。
          # 標準トークンのマージでは公開ページの更新が走らない場合があるため、その時だけトークンを登録する。
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: gh pr merge "$PR" --merge --repo "$GITHUB_REPOSITORY"
