<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ユズナミキ — 助っ人</title><style>*{box-sizing:border-box}body{margin:0;color:#eee1d5;background:#18171e;font:15px/1.7 system-ui}main{max-width:1000px;margin:auto;padding:22px}h1{color:#e6c3ee;font-size:25px}a{color:#e7c68e}.lead{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.lead img{width:210px;max-height:280px;object-fit:contain}button,select{background:#44334e;color:#fff0db;border:1px solid #ab8caf;padding:10px;font:inherit;border-radius:7px}#views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}figure{margin:0;text-align:center;border:1px solid #a482a644;border-radius:10px;background:radial-gradient(at 50% 70%,#54405b,#29242d 75%)}canvas{width:100%;height:auto}figcaption{color:#d9bddf}small{color:#b7aaba}@media(max-width:550px){#views{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><a href="../">本編</a> ／ <a href="game-review.html">同行・戦闘を試す</a><h1>ユズナミキ <small>狐耳の忍び</small></h1><div class="lead"><img src="source-art/yuzunamiki-canonical.png" alt="白い着物・紫の羽織とクナイ姿のユズナミキ"><div><p>装備はクナイと着物で固定。<br>主人公の攻撃・守備と、自分のレベルで強くなる。</p><p>クナイ：直線2マスまで、障害物を越えて攻撃。<br>狐火の襲：戦闘中に確率で発動。本人だけ4ターン2回行動。</p><small>攻撃＝主人公＋2＋0.8×(Lv−1)<br>守備＝主人公−1＋⌊(Lv−1)/3⌋（最低0）</small></div></div><p><label>動作 <select id="action"><option value="idle">待機</option><option value="walk">歩行</option><option value="attack">クナイ</option></select></label> <button id="pause">一時停止</button></p><div id="views"></div><p id="status">画像を読み込み中…</p><small>8方向を個別に描画。クナイの持ち手と髪飾りのため左右反転なし。</small></main><script>
const D=['S','SW','W','NW','N','NE','E','SE'],images={},cards=[],registration={};let stopped=false,last=0;for(const d of D){const el=document.createElement('figure');el.innerHTML='<figcaption>'+d+'</figcaption><canvas width="320" height="320"></canvas>';document.getElementById('views').append(el);cards.push({d,g:el.querySelector('canvas').getContext('2d')});}document.getElementById('pause').onclick=e=>{stopped=!stopped;e.target.textContent=stopped?'再生':'一時停止';};Promise.all([fetch('ally.json?v=ground-v3').then(r=>r.json()).then(meta=>Object.assign(registration,meta.views)),...D.flatMap(d=>['.png','-motion.png'].map(s=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[d+s]=im;resolve();};im.onerror=reject;im.src='assets/'+d+s;})))]).then(()=>{document.getElementById('status').textContent='待機・歩行・クナイの全24ポーズを読み込みました。';window.AllyArtReady=true;function frame(t){requestAnimationFrame(frame);if(stopped||t-last<70)return;last=t;const action=document.getElementById('action').value,phase=t%320;for(const {d,g}of cards){g.clearRect(0,0,320,320);const moving=action==='walk'?Math.floor(phase/80)%2===0:action==='attack'&&phase>=35&&phase<240;const origin=registration[d].anchors[moving?action:'idle'],scale=1.2;g.drawImage(images[d+(moving?'-motion.png':'.png')],moving&&action==='attack'?256:0,0,256,256,160-origin[0]*scale,280-origin[1]*scale,256*scale,256*scale);}}requestAnimationFrame(frame);}).catch(()=>document.getElementById('status').textContent='画像の読み込みに失敗しました。再読み込みしてください。');
</script></body></html>
