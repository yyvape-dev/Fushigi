<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>65°固定・森の完成アセット</title>
<style>body{margin:0;background:#162f32;color:#f4e7c5;font-family:system-ui,sans-serif}header{text-align:center;padding:20px}h1{font-size:22px;margin:0}p{font-size:13px;color:#afc6ba}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:1200px;margin:0 auto 20px;padding:0 15px}.item{background:#294443;border:1px solid #42605a;border-radius:10px;overflow:hidden;text-align:center}.item canvas{width:100%;display:block}.item span{display:block;padding:8px;font-size:14px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}</style>
<header><h1>灯祭りの森 — 65°固定の2Dアセット</h1><p>採用した木＋同じ画風の小物9点。各絵の陰影を描き込み、接地影と灯りは本編で追加。</p></header><main class="grid"></main>
<script type="module">
const items=[['tree','採用した大木'],['sapling','若木'],['stump','苔むす切り株'],['boulder','苔岩'],['rocks','小石'],['fern','シダ'],['mushrooms','キノコ'],['lantern','吊りランタン'],['lanternpost','ランタンの支柱'],['garland','祭りの連灯']];
await Promise.all(items.map(async([key,label])=>{const box=document.createElement('div');box.className='item';const c=document.createElement('canvas');c.width=c.height=256;const text=document.createElement('span');text.textContent=label;box.append(c,text);document.querySelector('.grid').append(box);const im=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src='../assets/dungeon/forest-fixed65-v1/'+key+'.png';});const g=c.getContext('2d');g.drawImage(im,0,0,256,256);const d=g.getImageData(0,0,256,256);for(let i=0;i<d.data.length;i+=4){const r=d.data[i],green=d.data[i+1],b=d.data[i+2];if(r>100&&b>100&&r>green*1.3&&b>green*1.3)d.data[i+3]=0;}g.putImageData(d,0,0);}));window.catalogReady=true;
</script></html>
